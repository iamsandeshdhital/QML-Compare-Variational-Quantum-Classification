[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-compare"
version = "1.0.0"
description = "Variational Quantum Classifier benchmarked against classical baselines, with circuit-depth and hardware-noise studies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anurag Jha" },
    { name = "Sandesh Dhital" },
]
maintainers = [
    { name = "Anurag Jha" },
    { name = "Sandesh Dhital" },
]
keywords = ["quantum-machine-learning", "vqc", "qiskit", "variational-circuits", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qml-compare = "qml_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
